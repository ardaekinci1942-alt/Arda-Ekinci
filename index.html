  <script>
    (function () {
      var d = document.documentElement, h = location.hash.replace(/^#\/?/, "");

      try { seen = sessionStorage.getItem("ae_intro") === "1"; } catch (e) {}
      try { rm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
      if (seen || rm || h.length > 0) d.classList.add("no-intro");
      try {
        var a = localStorage.getItem("ae_accent");
        if (/^#[0-9a-f]{6}$/i.test(a || "")) d.style.setProperty("--accent", a);
      } catch (e) {}
    })();
  </script>
